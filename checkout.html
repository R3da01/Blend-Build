<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRUME Coffee</title>
    <link rel="stylesheet" href="checkout.css">
    <script src="checkout.js" defer ></script>

</head>
<body>

    <div class="top">
        Du grain à votre tasse. Un café qui vous ressemble.
    </div>


    <header>
    <h1>♨ BRUME</h1>

    

    <nav class="nav_bar_02 hidden">
        <a href="#">L'atelier café</a>
        <a href="#">Notre savoir-faire</a>
        <a href="#">Besoin d'aide ?</a>
        
    </nav>

    <h2>🛍️<span>0</span></h2>




    
</header>

<main>

    <section class="carte">
        <h1 class="section-title">Votre panier</h1>
        
    </section>

    <section class="payment">
        <h2>Informations de livraison</h2>
        
        <div class="form">
        <div class="card">
            <label class="label">Prenom</label>
            <input type="text" class="input">
        </div>
        <div class="card">
            <label class="label">Nom</label>
            <input type="text" class="input">
        </div>
        <div class="card">
            <label class="label">Email</label>
            <input type="email" class="input">
        </div>
        <div class="card">
            <label class="label">Adresse de livraison</label>
            <input type="text" class="input">
        </div>


        <h2>Paiement de démonstration</h2>
        <div class="form">
        <div class="card icon-relative">
            <label class="label">Numéro de carte</label>
            <input type="text" class="input">
        </div>
         <div class="card icon-relative">
            <label class="label">Date d'expiration (MM/AA)</label>
            <input type="text" class="input">
        </div>
         <div class="card icon-relative">
            <label class="label">CVV</label>
            <input type="text" class="input">
        </div>

        <button type="submit">Confirmer la commande</button>

        </div>
        




        </div>



    </section>
</main>
<footer>
        <p>BRUME — Le goût de votre rythme.</p>
        <p>Une création unique, la vôtre.</p>
    </footer>
</body>
